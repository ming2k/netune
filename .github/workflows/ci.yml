name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read

jobs:
  lockfile:
    name: Lockfile resolves (--locked)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - run: cargo fetch --locked

  test:
    name: Test (${{ matrix.features }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        features: ["", "netune-probe/inject", "all-features"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - run: cargo nextest run --workspace
        if: matrix.features == ''
      - run: cargo nextest run -p netune-trace --no-default-features
        if: matrix.features == ''
      - run: cargo nextest run -p netune-trace --no-default-features --features ja4
        if: matrix.features == ''
      - run: cargo nextest run -p netune-trace --no-default-features --features serde
        if: matrix.features == ''
      - run: cargo nextest run -p netune-probe --features inject
        if: matrix.features == 'netune-probe/inject'
      - run: cargo nextest run --workspace --all-features
        if: matrix.features == 'all-features'

  feature-matrix:
    name: Feature & packaging matrix (MSRV 1.95.0)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      - name: Verify feature powerset across workspace and orchestrators
        run: |
          cargo hack check --each-feature --no-dev-deps --workspace
          cargo hack check --feature-powerset --no-dev-deps -p netune -p netune-server -p netune-trace
          cargo check --all-targets --all-features
          cargo check --all-targets --no-default-features
      - name: Verify package manifests (cargo package --list)
        run: |
          for manifest in crates/*/Cargo.toml; do
            name="$(sed -n 's/^name *= *"\(.*\)"/\1/p' "$manifest" | head -1)"
            if grep -q '^publish *= *false' "$manifest"; then
              echo "Skipping non-publishable crate $name"
              continue
            fi
            echo "Packaging dry-run list for $name"
            cargo package --list -p "$name" --allow-dirty >/dev/null
          done

  supply-chain:
    name: Supply chain, audit & SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources bans
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit
      - uses: Swatinem/rust-cache@v2
      - name: Generate CycloneDX SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --all --override-filename netune-sbom
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: "**/netune-sbom*"
          if-no-files-found: error

  lint:
    name: Clippy, fmt & zero-cost
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: No second crypto engine (INV-QUIC-01)
        run: |
          if cargo tree --all-features --invert ring 2>/dev/null | grep -q '^ring '; then
            echo "::error::ring is in the host dependency graph; aws-lc-rs is the only permitted crypto provider (INV-QUIC-01, ADR-0016)"
            cargo tree --all-features --invert ring
            exit 1
          fi
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: Zero-cost instruction gate (INV-TRACE-04)
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          cargo install gungraun-runner --version 0.20.0 --locked
          cargo bench -p netune --bench zero_cost -- --save-baseline=ci
          cargo bench -p netune --bench zero_cost -- --baseline=ci --callgrind-limits='ir=0%'
      - run: cargo fmt --check

  doc:
    name: Documentation integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      - name: Documentation integrity gate
        run: python3 .github/scripts/check-docs.py
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"
      - run: cargo test --doc --workspace --all-features
        env:
          RUSTFLAGS: ""

  docs-gate-selftest:
    name: Documentation gate self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: python3 .github/scripts/test-check-docs.py

  architecture:
    name: Architecture gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Architecture gate
        run: python3 .github/scripts/check-architecture.py
      - name: Architecture gate self-test
        run: python3 .github/scripts/test-check-architecture.py

  semver:
    name: SemVer compatibility (Stable tier)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: taiki-e/install-action@cargo-semver-checks
      - uses: Swatinem/rust-cache@v2
      - name: Check Stable API compatibility on patch bumps
        run: |
          version="$(awk '/^\[workspace\.package\]/{seen=1} seen && /^version *=/{gsub(/[" ]/,"",$3); print $3; exit}' Cargo.toml)"
          major_minor="${version%.*}"
          patch="${version##*.}"
          baseline="v${major_minor}.0"
          if [ "$patch" = "0" ]; then
            echo "Minor/initial release ${version}: no patch-compatibility baseline required against ${baseline}"
            exit 0
          fi
          if ! git rev-parse -q --verify "refs/tags/${baseline}" >/dev/null; then
            echo "::error::Missing minor baseline tag ${baseline} for patch release ${version}"
            exit 1
          fi
          cargo semver-checks check-release --baseline-rev "${baseline}" \
            -p netune -p netune-server -p netune-http1 -p netune-http2 \
            -p netune-ws -p netune-io -p netune-egress -p netune-trace -p netune-diagnostics
