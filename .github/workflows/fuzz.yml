name: Fuzz and soak

on:
  workflow_dispatch:
  schedule:
    # Weekly hardening, not a per-PR tax. Every parser crate runs a fast
    # deterministic fuzz pass on every PR; this workflow executes the deep
    # `--profile soak` mutation campaigns, long-running connection soak suites,
    # ASan verification of unsafe TLS FFI paths, and coverage-guided libFuzzer runs.
    - cron: "17 3 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  soak:
    name: Soak fuzzing and resource/connection soak
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - name: Parser soak fuzzing and connection/fd/stream soak
        run: >-
          cargo nextest run
          --workspace
          --all-features
          --run-ignored ignored-only
          --profile soak

  asan-tls:
    name: AddressSanitizer (netune-tls FFI and parser tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Run netune-tls unit and fuzz suites under ASan
        env:
          RUSTFLAGS: "-Z sanitizer=address -D warnings"
        run: |
          cargo +nightly test -p netune-tls --target x86_64-unknown-linux-gnu --lib
          cargo +nightly test -p netune-tls --target x86_64-unknown-linux-gnu --test fuzz

  libfuzzer:
    name: Coverage-guided libFuzzer (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: crates/netune-http1/fuzz
            target: fuzz_http1
          - dir: crates/netune-http2/fuzz
            target: fuzz_http2
          - dir: crates/netune-http3/fuzz
            target: fuzz_http3
          - dir: crates/netune-quic/fuzz
            target: fuzz_quic
          - dir: crates/netune-tls/fuzz
            target: fuzz_tls
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run libFuzzer (120s bounded campaign)
        env:
          RUSTFLAGS: ""
        run: >-
          cargo +nightly fuzz run ${{ matrix.target }}
          --fuzz-dir ${{ matrix.dir }}
          -- -max_total_time=120
