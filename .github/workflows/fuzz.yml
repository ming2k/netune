name: Fuzz and soak

on:
  workflow_dispatch:
  schedule:
    # Weekly hardening, not a per-PR tax. Every parser crate runs a fast
    # deterministic fuzz pass on every PR; this workflow executes the deep
    # `--profile soak` mutation campaigns and the long-running QUIC soak suite.
    - cron: "17 3 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  soak:
    name: Soak fuzzing and QUIC keep-alive
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - name: Parser soak fuzzing and QUIC stream/keep-alive soak
        run: >-
          cargo nextest run
          --workspace
          --all-features
          --run-ignored ignored-only
          --profile soak
