name: Release

# A release is defined by this repository: an annotated/signed tag that matches the
# workspace version, plus the GitHub Release this workflow creates from the
# matching CHANGELOG.md section (with attached CycloneDX SBOM). Distribution is by git tag:
#
#   netune = { git = "https://github.com/ming2k/netune", tag = "v0.1.0" }
#
# No registry account, token, or upload participates in making a release.
# See docs/dev/release-and-versioning.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Tag matches workspace version & is annotated
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify annotated tag object and version match
        run: |
          if ! git rev-parse -q --verify "refs/tags/${GITHUB_REF_NAME}^{tag}" >/dev/null; then
            echo "::error::tag ${GITHUB_REF_NAME} must be an annotated (preferably signed) tag, not a lightweight tag"
            exit 1
          fi
          version="$(awk '/^\[workspace\.package\]/{seen=1} seen && /^version *=/{gsub(/[" ]/,"",$3); print $3; exit}' Cargo.toml)"
          echo "tag=${GITHUB_REF_NAME} workspace_version=${version}"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match workspace version ${version}"
            exit 1
          fi

  release:
    name: GitHub Release ${{ github.ref_name }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      - name: Generate CycloneDX SBOM for release tag
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --output-prefix "netune-${GITHUB_REF_NAME}-sbom"
      - name: Assemble the release body from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/notes.md"
          body="$RUNNER_TEMP/body.md"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1 }
            found && index($0, "## [") == 1 && index($0, "## [" v "]") != 1 { exit }
            found { print }
          ' CHANGELOG.md > "$notes"
          if [ ! -s "$notes" ]; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi
          {
            echo "Crates in this tag:"
            echo
            echo "| crate | version |"
            echo "| :--- | :--- |"
            workspace="$(awk '/^\[workspace\.package\]/{seen=1} seen && /^version *=/{gsub(/[" ]/,"",$3); print $3; exit}' Cargo.toml)"
            for manifest in crates/*/Cargo.toml; do
              name="$(sed -n 's/^name *= *"\(.*\)"/\1/p' "$manifest" | head -1)"
              member_version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' "$manifest" | head -1)"
              printf '| `%s` | %s |\n' "$name" "${member_version:-$workspace}"
            done
            echo
            echo "Consume from this tag:"
            echo
            echo '```toml'
            echo "netune = { git = \"https://github.com/${GITHUB_REPOSITORY}\", tag = \"${GITHUB_REF_NAME}\" }"
            echo '```'
            echo
            echo "---"
            echo
            cat "$notes"
          } > "$body"
          mv "$body" "$notes"
      - name: Create or update the GitHub Release and upload SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "netune ${GITHUB_REF_NAME#v}" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "${GITHUB_REF_NAME}" *netune-${GITHUB_REF_NAME}-sbom*.json --clobber
