name: Release

# A release is defined by this repository: an annotated/signed tag that matches the
# workspace version, plus the GitHub Release this workflow creates from the
# matching CHANGELOG.md section (with attached CycloneDX SBOM). Distribution is by git tag:
#
#   netune = { git = "https://github.com/ming2k/netune", tag = "v0.1.0" }
#
# No registry account, token, or upload participates in making a release.
# See docs/dev/release-and-versioning.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Tag matches workspace version & is annotated
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Verify annotated tag object and version match
        id: check
        run: |
          tag_name="${{ inputs.tag || github.ref_name }}"
          git fetch origin "refs/tags/${tag_name}:refs/tags/${tag_name}" --force
          tag_type="$(git cat-file -t "refs/tags/${tag_name}")"
          echo "tag=${tag_name} type=${tag_type}"
          if [ "${tag_type}" != "tag" ]; then
            echo "::error::tag ${tag_name} must be an annotated (preferably signed) tag, not lightweight (got ${tag_type})"
            exit 1
          fi
          version="$(awk '/^\[workspace\.package\]/{seen=1} seen && /^version *=/{gsub(/[" ]/,"",$3); print $3; exit}' Cargo.toml)"
          echo "tag=${tag_name} workspace_version=${version}"
          if [ "${tag_name}" != "v${version}" ]; then
            echo "::error::tag ${tag_name} does not match workspace version ${version}"
            exit 1
          fi
          echo "tag=${tag_name}" >> "$GITHUB_OUTPUT"

  release:
    name: GitHub Release ${{ needs.verify.outputs.tag }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}
          fetch-tags: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      - name: Generate CycloneDX SBOM for release tag
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --all --override-filename "netune-${{ needs.verify.outputs.tag }}-sbom"
      - name: Assemble the release body from CHANGELOG.md
        run: |
          tag_name="${{ needs.verify.outputs.tag }}"
          version="${tag_name#v}"
          notes="$RUNNER_TEMP/notes.md"
          body="$RUNNER_TEMP/body.md"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1 }
            found && index($0, "## [") == 1 && index($0, "## [" v "]") != 1 { exit }
            found { print }
          ' CHANGELOG.md > "$notes"
          if [ ! -s "$notes" ]; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi
          {
            echo "Crates in this tag:"
            echo
            echo "| crate | version |"
            echo "| :--- | :--- |"
            workspace="$(awk '/^\[workspace\.package\]/{seen=1} seen && /^version *=/{gsub(/[" ]/,"",$3); print $3; exit}' Cargo.toml)"
            for manifest in crates/*/Cargo.toml; do
              name="$(sed -n 's/^name *= *"\(.*\)"/\1/p' "$manifest" | head -1)"
              member_version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' "$manifest" | head -1)"
              printf '| `%s` | %s |\n' "$name" "${member_version:-$workspace}"
            done
            echo
            echo "Consume from this tag:"
            echo
            echo '```toml'
            echo "netune = { git = \"https://github.com/${GITHUB_REPOSITORY}\", tag = \"${tag_name}\" }"
            echo '```'
            echo
            echo "---"
            echo
            cat "$notes"
          } > "$body"
          mv "$body" "$notes"
      - name: Create or update the GitHub Release and upload SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_name="${{ needs.verify.outputs.tag }}"
          if gh release view "${tag_name}" >/dev/null 2>&1; then
            gh release edit "${tag_name}" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "${tag_name}" \
              --title "netune ${tag_name#v}" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
          mapfile -t sboms < <(find . -maxdepth 4 -name "netune-${tag_name}-sbom*" -type f | sort)
          if [ "${#sboms[@]}" -eq 0 ]; then
            echo "::error::no SBOM files generated"
            exit 1
          fi
          tar -czf "netune-${tag_name}-sboms.tar.gz" "${sboms[@]}"
          gh release upload "${tag_name}" "netune-${tag_name}-sboms.tar.gz" --clobber
