[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"

# Shared external dependencies, pinned once here. Crates reference them with
# `dep = { workspace = true }` (optionally adding features). Internal crates
# stay as path dependencies in each member's Cargo.toml.
[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1"
libc = "0.2"
http = "1.4"
tokio = { version = "1", default-features = false }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "logging", "std", "tls12"] }
rustls-platform-verifier = "0.6"
base64 = "0.22"
brotli = "8"
flate2 = { version = "1.1", features = ["zlib-rs"] }
rcgen = "0.14"

# Workspace-wide lint policy (inherited by every member via `lints.workspace =
# true`). `unwrap_used` / `expect_used` are *warnings*, not denies: keeping them
# as warnings makes every new, unguarded `unwrap`/`expect` visible in review.
# The codebase deliberately recovers from `Mutex` poisoning instead of panicking
# (the `unwrap_or_else(|e| e.into_inner())` idiom), so production lock sites do
# not trip this lint. Tests are exempted: they should panic on assertion
# failure, so each crate's `lib.rs` allows both lints under `#[cfg_attr(test,
# ...)]`.
[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# Keep local builds and test binaries useful for backtraces without embedding
# full dependency debug information in every linked artifact.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = "line-tables-only"
incremental = false

[profile.test.package."*"]
debug = 0

