[workspace]
members = ["crates/*"]
resolver = "2"

# The workspace root is also a test-only package. Cargo cannot compile a
# `tests/` directory that belongs to no package, and a virtual workspace has no
# package at all; declaring the harness here is what makes the shared
# integration/e2e entry points real nextest targets. `check-architecture.py`
# (ARCH-012) enforces that it stays test-only: no library, no binary and no
# production dependencies.
[package]
name = "workspace-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

# The harness mirrors the optional capabilities the suites exercise. `http2`
# and `ws` match the orchestrators' defaults; `tls` and `http3` stay opt-in so
# the default CI run keeps the same posture as the crates, and
# `--all-features` is the run that executes the opt-in ingress paths.
[features]
default = ["http2", "ws"]
http2 = ["netune/http2", "netune-server/http2"]
ws = ["netune/ws"]
tls = ["netune-server/tls"]
http3 = ["tls", "netune/http3", "netune-server/http3"]

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"

[dev-dependencies]
brotli = { workspace = true }
bytes = { workspace = true }
flate2 = { workspace = true }
http = { workspace = true }
netune = { path = "crates/netune", version = "0.0.33", default-features = false }
netune-http1 = { path = "crates/netune-http1", version = "0.0.33" }
netune-http2 = { path = "crates/netune-http2", version = "0.0.33" }
netune-http3 = { path = "crates/netune-http3", version = "0.0.33" }
netune-quic = { path = "crates/netune-quic", version = "0.0.33" }
netune-server = { path = "crates/netune-server", version = "0.0.33", default-features = false }
netune-tls = { path = "crates/netune-tls", version = "0.0.33" }
test-support = { path = "crates/test-support", version = "0.0.33" }
netune-trace = { path = "crates/netune-trace", version = "0.0.33" }
netune-webtransport = { path = "crates/netune-webtransport", version = "0.0.33" }
netune-ws = { path = "crates/netune-ws", version = "0.0.33" }
quinn = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
tokio-rustls = { workspace = true }

[lints]
workspace = true

[workspace.package]
version = "0.0.33"
edition = "2024"
rust-version = "1.95"
license = "MIT"
readme = "README.md"

# Shared external dependencies, pinned once here. Crates reference them with
# `dep = { workspace = true }` (optionally adding features). Internal crates
# stay as path dependencies in each member's Cargo.toml.
[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1"
libc = "0.2"
http = "1.4"
tokio = { version = "1", default-features = false }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "logging", "std", "tls12"] }
rustls-platform-verifier = "0.6"
aws-lc-rs = "1.18"
base64 = "0.22"
brotli = "8"
flate2 = { version = "1.1", features = ["zlib-rs"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs"] }
socket2 = { version = "0.6", features = ["all"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
quinn-proto = { version = "0.11", default-features = false, features = ["rustls-aws-lc-rs"] }
# Dev-only interop oracles. netune-http3 owns its H3 state machine and QPACK
# codec (ADR-0027); neither crate may appear in a production dependency graph.
h3 = "0.0.8"
h3-quinn = "0.0.10"
# The owned TLS engine's chain validator (a verifier, not a TLS engine).
rustls-webpki = { version = "0.103", default-features = false, features = ["std", "aws-lc-rs"] }
webpki-root-certs = "1.0"
thiserror = "2.0"

# Workspace-wide lint policy (inherited by every member via `lints.workspace =
# true`). `unwrap_used` / `expect_used` are *warnings*, not denies: keeping them
# as warnings makes every new, unguarded `unwrap`/`expect` visible in review.
# The codebase deliberately recovers from `Mutex` poisoning instead of panicking
# (the `unwrap_or_else(|e| e.into_inner())` idiom), so production lock sites do
# not trip this lint. Tests are exempted: they should panic on assertion
# failure, so each crate's `lib.rs` allows both lints under `#[cfg_attr(test,
# ...)]`.
[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# Keep local builds and test binaries useful for backtraces without embedding
# full dependency debug information in every linked artifact.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = "line-tables-only"
incremental = false

[profile.test.package."*"]
debug = 0

