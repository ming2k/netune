[package]
name = "netune-diagnostics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Native diagnostic sinks and review bundles for netune traces"
repository = "https://github.com/ming2k/netune"
license.workspace = true
readme.workspace = true
keywords = ["observability", "diagnostics", "trace", "debugging"]
categories = ["network-programming", "development-tools::debugging"]

[package.metadata.docs.rs]
all-features = true

[[bin]]
name = "netune-diagnose"
path = "src/bin/netune-diagnose.rs"

[dependencies]
netune-trace = { path = "../netune-trace", version = "0.0.28" }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
