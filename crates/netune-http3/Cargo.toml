[package]
name = "netune-http3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "HTTP/3 client transport and request dispatch (RFC 9114) for netune"
repository = "https://github.com/ming2k/netune"
license.workspace = true
readme = false

[dependencies]
bytes = { workspace = true }
h3 = { workspace = true }
h3-quinn = { workspace = true }
http = { workspace = true }
netune-quic = { path = "../netune-quic", version = "0.0.9" }
netune-trace = { path = "../netune-trace", version = "0.0.9" }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "time", "sync"] }

[dev-dependencies]
rcgen = { workspace = true }
rustls = { workspace = true }
quinn = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
