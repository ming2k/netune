[package]
name = "netune-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Observable HTTP/1.1, HTTP/2 and optional HTTP/3 ingress: admission control, slow-peer bounds, streaming responses and graceful drain"
repository = "https://github.com/ming2k/netune"
license.workspace = true
readme.workspace = true
keywords = ["http", "server", "observability", "http1", "http2"]
categories = ["network-programming", "web-programming::http-server", "asynchronous"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
bytes = { workspace = true }
http = { workspace = true }
netune-http1 = { path = "../netune-http1", version = "0.0.10" }
netune-http2 = { path = "../netune-http2", version = "0.0.10", optional = true }
netune-http3 = { path = "../netune-http3", version = "0.0.10", optional = true }
netune-quic = { path = "../netune-quic", version = "0.0.10", optional = true }
netune-io = { path = "../netune-io", version = "0.0.10" }
netune-trace = { path = "../netune-trace", version = "0.0.10" }
tokio = { workspace = true, features = ["net", "io-util", "time", "sync", "rt", "macros"] }
# TLS termination. `rustls` is a TLS implementation, not an HTTP one, so it does not cross the
# red-line ADR-0001 draws: nothing here parses HTTP, and the handshake is exactly what a server has
# to own if it is to report what the handshake cost (ADR-0015).
tokio-rustls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }

[features]
# Both protocols are on by default, because a public listener that silently cannot answer the
# protocol a browser negotiates is not a listener an operator wants.
#
# `http1-only` exists for the case the egress crate already honours: a listener that serves one
# protocol should not link the other's parser. HPACK's Huffman tables and the frame decoder are
# ~1,500 lines of parsing on an externally-controlled byte path, and a parser that is never
# executed is pure attack surface rather than hypothetical risk. Turning the feature off is not a
# silent degradation — `Protocols::HTTP2` is then refused at bind time, so a configuration that
# asks for a protocol the build cannot speak fails loudly instead of accepting and closing.
default = ["http2"]
http2 = ["dep:netune-http2"]
# TLS termination. Off by default because a plaintext listener behind a terminator must not link a
# TLS stack it never calls — the same argument as `http2`.
tls = ["dep:tokio-rustls", "dep:rustls"]
# HTTP/3 ingress. QUIC is always TLS, so this feature implies `tls`.
http3 = ["dep:netune-http3", "dep:netune-quic", "dep:rustls", "tls"]

[dev-dependencies]
# `netune` is a dev-dependency only: the interop suite proves that our egress client
# and our ingress server interoperate, which is a property neither crate's own tests
# can assert without depending on the other. Production dependencies stay leaf-only
# ([INV-SERVER-01]); a `[dependencies]` entry here would be the inversion.
netune = { path = "../netune", version = "0.0.10" }
netune-http1 = { path = "../netune-http1", version = "0.0.10" }
netune-http2 = { path = "../netune-http2", version = "0.0.10" }
netune-http3 = { path = "../netune-http3", version = "0.0.10" }
netune-quic = { path = "../netune-quic", version = "0.0.10" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
# A self-signed certificate generator, so the TLS suite tests a real handshake rather than a mock.
rcgen = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }

[lints]
workspace = true
