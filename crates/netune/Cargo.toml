[package]
name = "netune"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "An owned, observable, intervention-capable network stack: DNS/TCP/TLS transport with a syscall tap, proxies, connection pool, and fault injection"
repository = "https://github.com/ming2k/netune"
license.workspace = true
readme.workspace = true
keywords = ["http", "tls", "network", "proxy", "observability"]
categories = ["network-programming", "web-programming::http-client", "asynchronous"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Both protocol codecs are opt-in so that a consumer which speaks neither can
# compile them out entirely.
#
# The motivating case is Estuary (the reference consumer): it speaks HTTP/1.1
# only and never opens a WebSocket, yet it previously linked ~2,975 lines of
# HTTP/2 (HPACK, Huffman) and RFC 6455 framing — parsers that sit on the
# credential-egress path and are never executed. Dead protocol parsers are pure
# attack surface.
#
# `default` keeps both on so the workspace's own tests and existing consumers
# are unaffected. Turning them off does NOT silently degrade behaviour: asking
# the client to negotiate HTTP/2 or open a WebSocket without the corresponding
# feature returns an error rather than quietly falling back to HTTP/1.1, because
# that fallback would change the wire signature the caller asked for.
default = ["http2", "ws"]
http2 = ["dep:netune-http2"]
# `ws_session` drives `tokio::select!`, so the macro support must travel with
# the feature rather than being assumed from the default feature set.
ws = ["dep:netune-ws", "tokio/macros"]

[dependencies]
base64 = { workspace = true }
brotli = { workspace = true }
bytes = { workspace = true }
flate2 = { workspace = true }
http = { workspace = true }
libc = { workspace = true }
netune-http1 = { path = "../netune-http1", version = "0.0.1" }
netune-http2 = { path = "../netune-http2", version = "0.0.1", optional = true }
netune-trace = { path = "../netune-trace", version = "0.0.1" }
netune-ws = { path = "../netune-ws", version = "0.0.1", optional = true }
rustls = { workspace = true }
rustls-platform-verifier = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "time", "sync", "rt"] }
tokio-rustls = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
brotli = { workspace = true }
flate2 = { workspace = true }
http = { workspace = true }
netune-trace = { path = "../netune-trace", version = "0.0.1" }
rcgen = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }

[lints]
workspace = true
