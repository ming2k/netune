[package]
name = "netune"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "An owned, observable, intervention-capable network stack: DNS/TCP/TLS transport with a syscall tap, proxies, connection pool, and fault injection"
repository = "https://github.com/ming2k/netune"
license.workspace = true

[dependencies]
base64 = { workspace = true }
brotli = { workspace = true }
bytes = { workspace = true }
flate2 = { workspace = true }
http = { workspace = true }
libc = { workspace = true }
netune-http1 = { path = "../netune-http1", version = "0.1.0" }
netune-trace = { path = "../netune-trace", version = "0.1.0" }
rustls = { workspace = true }
rustls-platform-verifier = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "time", "sync", "rt"] }
tokio-rustls = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
brotli = { workspace = true }
flate2 = { workspace = true }
http = { workspace = true }
netune-trace = { path = "../netune-trace", version = "0.1.0" }
rcgen = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }

[lints]
workspace = true
