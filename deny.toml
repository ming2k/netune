# Dependency policy for netune (supply-chain and advisory gate).
# Enforced in CI by `cargo deny check`.

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
skip = [
    # Crypto verification crate split across aws-lc-rs (0.7.1) and rustls-webpki (0.9.0).
    # Both use AWS-LC-backed primitives for signature verification; re-review by 2027-05-16.
    { crate = "untrusted@0.7.1", reason = "Required by aws-lc-rs; rustls-webpki uses 0.9.0 (review 2027-05-16)" },
    # Build-time proc-macro parser only (rung in dev/macro transitive deps); review 2027-05-16.
    { crate = "syn@2.0.119", reason = "Proc-macro build dependency pulled by gungraun / jni / thiserror 1.x (review 2027-05-16)" },
    { crate = "thiserror@1.0.69", reason = "Pulled transitively via rustls-platform-verifier -> jni (review 2027-05-16)" },
    { crate = "thiserror-impl@1.0.69", reason = "Proc-macro for thiserror 1.0.69 via rustls-platform-verifier -> jni (review 2027-05-16)" },
    # Windows bindings in unused cross-platform transitive edges (Linux Tier-1 host).
    { crate = "windows-sys@0.45.0", reason = "Unused Windows target dep via jni / platform verifier (review 2027-05-16)" },
]
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
    { name = "reqwest" },
    { name = "hyper-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
